# Nginx site for ammos.eu  →  copy to /etc/nginx/sites-available/ammos
# (Certbot adds the HTTPS part automatically afterwards.)

upstream ammos_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ammos.eu www.ammos.eu;

    # uploads from the admin can be large (photos / short videos)
    client_max_body_size 90M;

    # gzip for text files
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # uploaded photos & videos are served straight from disk (fast)
    location /uploads/ {
        alias /var/www/ammos/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Next.js build files never change once built
    location /_next/static/ {
        proxy_pass http://ammos_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ammos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
